name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/fix-modules-logout-0163iMNTptkVzGKfcxUvJqVv
      - claude/allergy-portal-dashboard-011CUoRQwKL75DR6xs1K8yHJ
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Hostinger via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        password: ${{ secrets.HOSTINGER_PASSWORD }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          echo "🚀 Starting deployment..."
          cd ${{ secrets.HOSTINGER_PATH }}

          # Check if git repository exists
          if [ ! -d ".git" ]; then
              echo "📦 Cloning repository..."
              git clone -b claude/fix-modules-logout-0163iMNTptkVzGKfcxUvJqVv https://github.com/okansay/allergy.tr.git .
          else
              echo "📥 Pulling latest changes..."
              git fetch origin
              git reset --hard origin/claude/fix-modules-logout-0163iMNTptkVzGKfcxUvJqVv
          fi

          echo "📂 Current directory: $(pwd)"
          echo "📋 Files in public directory:"
          ls -la public/ || echo "❌ public/ directory not found!"

          # Remove symlink if exists
          if [ -L "public_html" ]; then
              echo "🔗 Removing old symlink..."
              rm public_html
          fi

          # Remove old public_html directory if it exists
          if [ -d "public_html" ] && [ ! -L "public_html" ]; then
              echo "🗑️  Cleaning old public_html directory..."
              rm -rf public_html
          fi

          # Create fresh public_html directory
          echo "📁 Creating public_html directory..."
          mkdir -p public_html

          # Copy all necessary folders to public_html
          echo "📋 Copying files with rsync..."

          # Copy public/ contents to root of public_html/
          rsync -av --delete public/ public_html/

          # Copy api/ folder into public_html/
          rsync -av --delete api/ public_html/api/

          # Copy shared/ folder into public_html/
          rsync -av --delete shared/ public_html/shared/

          # Copy database/ folder into public_html/ (for migrations)
          rsync -av --delete database/ public_html/database/

          echo "📋 Files in public_html after rsync:"
          ls -la public_html/

          # Ensure correct permissions
          echo "🔐 Setting permissions..."
          chmod -R 755 public_html
          find public_html -name "*.php" -exec chmod 644 {} \;

          echo "✅ Deployment completed successfully!"
