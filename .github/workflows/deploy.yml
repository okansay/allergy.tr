name: Deploy to Hostinger

on:
  push:
    branches:
      - claude/allergy-portal-dashboard-011CUoRQwKL75DR6xs1K8yHJ
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to Hostinger via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOSTINGER_HOST }}
        username: ${{ secrets.HOSTINGER_USERNAME }}
        password: ${{ secrets.HOSTINGER_PASSWORD }}
        port: ${{ secrets.HOSTINGER_PORT }}
        script: |
          cd ${{ secrets.HOSTINGER_PATH }}

          # Pull latest changes
          git pull origin claude/allergy-portal-dashboard-011CUoRQwKL75DR6xs1K8yHJ || git clone -b claude/allergy-portal-dashboard-011CUoRQwKL75DR6xs1K8yHJ https://github.com/okansay/allergy.tr.git .

          # Remove symlink if exists and copy files to public_html
          if [ -L "public_html" ]; then
              rm public_html
          fi

          # Create public_html directory if it doesn't exist
          mkdir -p public_html

          # Copy all files from public to public_html
          rsync -av --delete public/ public_html/

          # Ensure correct permissions
          chmod -R 755 public_html
          find public_html -name "*.php" -exec chmod 644 {} \;

          echo "✅ Deployment completed successfully!"
